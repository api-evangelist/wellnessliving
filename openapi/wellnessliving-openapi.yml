components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'The officially published OpenAPI declares a JWT Bearer scheme: sign in via `POST /Core/Passport/Login/Enter/Enter.json`,
        then mint a token with `GET /Core/Passport/Enter/Jwt/JwtToken.json` and send it as `Authorization:
        Bearer <token>`. The underlying PHP/JS SDKs additionally support the legacy scheme: a registered
        Application ID + secret code sign a per-request HMAC (SHA3-based) placed in the `Authorization:`
        header alongside session cookies established by the `Notepad`/`Enter` model pair. Both schemes
        require WellnessLiving''s Integrations Team to first approve API access, sign an NDA and API Agreement,
        and issue application credentials.'
  parameters:
    XErrorRules:
      name: X-Error-Rules
      in: header
      required: false
      schema:
        type: string
      description: Opt in to mapping internal API error statuses to real 4xx HTTP codes. By default the
        API always answers HTTP 200 even on error, with the failure encoded in the JSON body; setting
        this header (e.g. to `default`) makes the gateway translate matched error statuses to 400/403/404
        responses instead.
  responses:
    BadRequest:
      description: 'Client-side error: invalid input, failed validation, throttling, or other request
        error (only returned as an HTTP status when `X-Error-Rules` opts in; otherwise encoded in a 200
        body).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired, or invalid Bearer token / session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted to access this business, location, or resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The request payload failed field-level validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: Standard WellnessLiving API error response shape.
      properties:
        status:
          type: string
          description: Machine-readable status/error code string (e.g. `access-denied`, `not-found`).
        text_message:
          type: string
          description: Human-readable error message.
        a_field:
          type: object
          additionalProperties: true
          description: Per-field validation errors, when the failure is a 422-style validation error.
