meters:
- name: location_subscription
  description: Per-location monthly (or annual) subscription fee, tiered by plan (Starter/Business/BusinessPro/Enterprise).
  unit: locations
  aggregation: sum
  dimensions:
  - business
  - location
  - plan_tier
- name: payment_processing_volume
  description: Payment volume processed through the Thoth WlPay embedded payments microservice, typically billed as a percentage plus per-transaction fee.
  unit: currency
  aggregation: sum
  dimensions:
  - business
  - location
- name: api_integration_agreement
  description: Contractual API/integration access granted under a signed NDA and API Agreement; not itself a metered charge in the public pricing model.
  unit: contract
  aggregation: sum
  dimensions:
  - business
  - application
principles:
- name: Visibility
  description: Track per-location subscription tier and add-ons (white-label, marketing) separately from payment-processing volume, since they bill differently.
- name: Allocation
  description: For multi-location or franchise accounts, allocate the per-location subscription fee to the cost center that owns each physical/virtual location.
- name: Optimization
  description: Right-size the plan tier per location (Starter vs. Business vs. BusinessPro) based on actual feature usage - staff count, rewards program, marketing - rather than defaulting every location to the top tier.
- name: Accountability
  description: Assign an owner for the API Agreement and application credentials so integration usage and any future metered API terms are reviewed against the business relationship, not left to drift after the initial integration ships.
