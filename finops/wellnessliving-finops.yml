description: >-
  FinOps view of WellnessLiving spend. The dominant cost is the per-location monthly (or
  discounted annual) software subscription across four tiers - Starter, Business, BusinessPro,
  Enterprise - which scales with the number of physical/virtual locations a business operates,
  not with API call volume. There is no separate published per-call or per-request price for
  the API itself: API access is a contractual add-on (NDA plus API Agreement, approved by the
  Integrations Team) layered on top of an existing subscription, and WellnessLiving does not
  publish metered API billing. Payment processing (the Thoth WlPay microservice) carries its own
  transaction-based processing fees typical of embedded payments, separate from the software
  subscription.
notes: >-
  Per-location subscription rates and processing fees are not reconciled here; verify current
  figures on the WellnessLiving pricing page and payment-processing agreement. Treat the API
  itself as a zero-marginal-cost feature of an existing subscription rather than a distinct
  FinOps meter, unless WellnessLiving specifies otherwise in a given API Agreement.
