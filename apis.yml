aid: wellnessliving
url: https://raw.githubusercontent.com/api-evangelist/wellnessliving/refs/heads/main/apis.yml
name: WellnessLiving
kind: company
description: 'WellnessLiving is all-in-one business-management software for fitness studios, gyms, spas,
  salons, and wellness businesses - scheduling, point of sale, memberships/passes, marketing, and client
  engagement in one platform, serving over 10 million users worldwide. WellnessLiving publishes a real,
  extensive RESTful API (324+ JSON-over-HTTPS endpoints across 45+ resource areas as of the 2026-06-20
  build) that powers its own Achieve client app and Elevate staff app - documented in an official public
  OpenAPI specification (github.com/wellnessliving/openapi) and public PHP/JavaScript SDKs (wl-sdk, wl-sdk-js)
  - but the API itself is partner-gated: access requires contacting a WellnessLiving Account Executive
  or Support, completing an API Access Questionnaire, and signing an NDA and API Agreement before the
  Integrations Team issues application credentials for staging and production. Core resources cover clients/members,
  classes and schedules, one-on-one appointments, the shared booking/checkout wizard, memberships and
  passes (Purchase Options), staff, locations, business configuration, retail sales/catalog, payments
  (the Thoth payment microservice), authentication, rewards/loyalty, reviews, reporting, and a channel-based
  real-time WebSocket notification layer.'
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
